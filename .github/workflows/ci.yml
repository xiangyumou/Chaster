name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: chaster
          POSTGRES_PASSWORD: chaster_password
          POSTGRES_DB: chaster
        ports:
          - 5432:5432
        # Wait for postgres to be ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Lint
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://chaster:chaster_password@localhost:5432/chaster
          TEST_TOKEN: tok_test_integration_fixed
          UNIT_TEST_TOKEN: tok_test_integration_fixed
        run: npm run test

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql://chaster:chaster_password@localhost:5432/chaster
          TEST_TOKEN: tok_test_integration_fixed
          API_TOKEN: tok_test_integration_fixed

          RUN_INTEGRATION_TESTS: 1
          REDIS_URL: redis://localhost:6379
          RATE_LIMIT_MAX: '0'
          RATE_LIMIT_FAIL_OPEN: 'true'
        run: |
          # Start the app in the background
          npm run build
          node .next/standalone/server.js &
          # Wait for app to be ready
          npx wait-on http://localhost:3000/api/health -t 60000
          # Run integration tests
          npm run test:integration

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
