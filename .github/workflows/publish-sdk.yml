name: Publish SDK

on:
  push:
    tags:
      - 'v*'  # Trigger on tags like v1.0.0, v0.1.5
  workflow_dispatch:

jobs:
  publish:
    name: Publish SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Generate SDK
        run: npm run sdk:generate

      - name: Set SDK Version
        run: |
          # Extract version from tag (e.g. v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting version to $VERSION"
          cd sdk
          npm version $VERSION --no-git-tag-version || npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Install SDK dependencies and Build
        run: npm run sdk:build

      - name: Publish to NPM
        working-directory: ./sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
