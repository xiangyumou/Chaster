services:
  db:
    image: postgres:16-alpine
    container_name: chaster-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chaster_password}
      POSTGRES_DB: ${POSTGRES_DB:-chaster}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chaster} -d ${POSTGRES_DB:-chaster}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chaster-app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-chaster}:${POSTGRES_PASSWORD:-chaster_password}@db:5432/${POSTGRES_DB:-chaster}
      REDIS_URL: redis://redis:6379
      MOCK_DRAND: "true"
      API_TOKEN: ${API_TOKEN:-your_secure_token_here}
    restart: always

  redis:
    image: redis:7-alpine
    container_name: chaster-redis
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
